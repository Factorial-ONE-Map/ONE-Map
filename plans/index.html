<script>(function(){var t=new URLSearchParams(location.search).get("theme");try{if(t!=="dark"&&t!=="light")t=localStorage.getItem("onemap-theme")}catch(e){}if(t==="dark")document.documentElement.setAttribute("data-theme","dark")})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* selector de planes */
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick button{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 16px;text-align:left;display:grid;gap:3px;min-width:150px;transition:border-color .15s,background .15s}
.pick button b{font-size:16px;font-weight:500}
.pick button span{font-size:12.5px;color:var(--ink-2)}
.pick button:hover{border-color:var(--red)}
.pick button[aria-pressed="true"]{border-color:var(--red);background:var(--r10)}
.pick .sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.hint{font-size:13.5px;color:var(--ink-2);margin-top:12px}

/* resumen de los planes elegidos */
.sum{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:28px}
.sum .card{display:grid;gap:12px;align-content:start}
.sum h3{font-size:22px;letter-spacing:-0.03em}
.sum .count{font-size:14px;color:var(--ink-2)}
.fam{display:flex;flex-wrap:wrap;gap:6px}
.fam span{font-size:12.5px;border-radius:999px;padding:3px 10px;background:var(--ink-50);color:var(--ink-2)}
.fam span.on{background:var(--r10);color:var(--r140);font-weight:500}
.adds{font-size:14px;color:var(--ink-2)}
.adds b{color:var(--ink);font-weight:500}

/* tabla comparativa */
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:36px 0 12px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s var(--ease)}
.switch input:checked{background:var(--red)}
.switch input:checked::after{transform:translateX(16px)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2)}
.tbl{border:1px solid var(--line);border-radius:20px;overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
thead th{position:sticky;top:0;background:var(--panel);z-index:1;font-weight:500;font-size:14px}
thead th.col{text-align:center;min-width:120px}
tbody tr:last-child td{border-bottom:0}
tr.famrow td{background:var(--ink-50);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
td.mod a{text-decoration:none;color:var(--ink)}
td.mod a:hover{color:var(--r140);text-decoration:underline}
td.mod .es{font-size:11.5px;font-weight:500;color:var(--r140);background:var(--r10);border-radius:6px;padding:1px 6px;margin-left:6px}
td.c{text-align:center}
.yes{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff}
.no{color:var(--ink-3)}
tr.diff td.mod{box-shadow:inset 3px 0 0 var(--red)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* extras */
.extras{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.extras h3{font-size:18px;letter-spacing:-0.02em;margin-bottom:10px}
.extras ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.extras li b{display:block;font-weight:500}
.extras li span{font-size:13.5px;color:var(--ink-2)}
.extras .sub{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--r140);margin:14px 0 8px}
@media (max-width:600px){ th,td{padding:9px 10px} thead th.col{min-width:92px} }
</style>
</head>

</main>

/* ---------- LÓGICA ---------- */
const lang = SITE.lang, t = TX[lang] || TX.en, own = OWN[lang] || OWN.en;
const I = { en: EN, de: DE, pt: PT, 'pt-br': BR, fr: FR, it: IT, pl: PL };
const modName = r => own[r.k] || (I[lang] && I[lang].M[r.map] ? I[lang].M[r.map].name : (M[r.map] ? M[r.map].name : r.k));
const famName = f => f.hub ? ((I[lang] && I[lang].HUBS[f.hub]) || HUBS[f.hub]).name : own.core;
const rows = FAMILIES.flatMap(f => f.rows);
const has = (b, r) => r.b.includes(b);
const count = b => rows.filter(r => has(b, r)).length;
const B = id => BUNDLES.find(x => x.id === id);

document.documentElement.lang = lang;
['eyebrow','title','lede','choose','hint','only','inc','notinc','extrasT','extrasD','foot'].forEach(k => { const n = document.getElementById('t-' + k); if (n) n.textContent = t[k]; });
document.title = 'Factorial · ' + t.title;
SITE.bar('plans/'); SITE.theme(document.getElementById('themeBtn')); SITE.langSelect(document.getElementById('langSel'));

let sel = (() => { const q = new URLSearchParams(location.search).get('plans'); const v = (q || '').split(',').filter(B); return v.length ? v.slice(0, 3) : ['ps', 'fin']; })();
const pick = document.getElementById('pick');
pick.setAttribute('aria-label', t.choose);
pick.innerHTML = BUNDLES.map(b => `<button type="button" data-id="${b.id}"><b><span class="sw" style="background:${b.color}"></span>${b.name}</b><span>${t.modules(count(b.id))}</span></button>`).join('');
pick.addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return; const id = btn.dataset.id;
  if (sel.includes(id)) sel = sel.filter(x => x !== id); else { sel.push(id); if (sel.length > 3) sel.shift(); }
  const u = new URL(location.href); u.searchParams.set('plans', sel.join(',')); history.replaceState(null, '', u);
  render();
});
document.getElementById('onlyDiff').addEventListener('change', render);

function render() {
  pick.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(sel.includes(b.dataset.id))));
  const order = BUNDLES.map(b => b.id).filter(id => sel.includes(id));
  // resumen
  document.getElementById('sum').innerHTML = order.map(id => {
    const others = order.filter(x => x !== id);
    const fams = FAMILIES.map(f => `<span class="${f.rows.some(r => has(id, r)) ? 'on' : ''}">${famName(f)}</span>`).join('');
    const adds = others.map(o => { const n = rows.filter(r => has(id, r) && !has(o, r)).length; return n ? `<p class="adds">${t.adds(B(id).name, B(o).name, n)}</p>` : ''; }).join('');
    return `<div class="card"><h3><span class="sw" style="display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:${B(id).color}"></span>${B(id).name}</h3><p class="count">${t.modules(count(id))}</p><div class="fam">${fams}</div>${adds}</div>`;
  }).join('');
  // tabla
  const only = document.getElementById('onlyDiff').checked;
  const tb = document.getElementById('tbl');
  if (order.length < 2) { tb.innerHTML = `<tbody><tr><td class="empty">${t.pickMore}</td></tr></tbody>`; return; }
  let h = `<thead><tr><th scope="col">${t.product}</th>${order.map(id => `<th scope="col" class="col">${B(id).name}</th>`).join('')}</tr></thead><tbody>`;
  FAMILIES.forEach(f => {
    const list = f.rows.filter(r => !only || new Set(order.map(id => has(id, r))).size > 1);
    if (!list.length) return;
    h += `<tr class="famrow"><td colspan="${order.length + 1}">${famName(f)}</td></tr>`;
    list.forEach(r => {
      const diff = new Set(order.map(id => has(id, r))).size > 1;
      const name = modName(r) + (r.es ? '<span class="es">ES</span>' : '');
      const link = r.map ? `<a href="${SITE.mapLink(r.map)}">${name}</a>` : name;
      h += `<tr class="${diff ? 'diff' : ''}"><td class="mod">${link}</td>${order.map(id => `<td class="c">${has(id, r) ? `<span class="yes" role="img" aria-label="${t.inc}">✓</span>` : `<span class="no" role="img" aria-label="${t.notinc}">—</span>`}</td>`).join('')}</tr>`;
    });
  });
  tb.innerHTML = h + '</tbody>';
}
render();

</script>
